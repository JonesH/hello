name: build

# Builds and publishes the app image. The convergence loop then applies the
# deployment from `JonesH/infra` — the payload ships there (`deployments/jonesh-hello/`,
# sourceless), and a tenant source may not name another repo, so the app repo does
# not apply anything itself. Release flow: this job pushes `:sha-<commit>` + the
# digest; pinning that digest in `JonesH/infra` is the release act.
#
# Precondition — a jonesh runner. The tenant broker serves
# `[self-hosted, <tenant>, <tier>]` (runner-broker/tiers.yml); the `jonesh` project
# exists but has no broker yet, so this job queues until `bartixcloud-runners` is
# installed on the JonesH owner and the row lands in bartixcloud/infra
# (`tenants.yml` → `install.sh` → `bcx-broker@jonesh`).

on:
  push:
    branches: [main]
    paths:
      - app.py
      - requirements.txt
      - Dockerfile
      - docker-compose.yml
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jonesh/hello

jobs:
  build:
    runs-on: [self-hosted, jonesh, build]
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Digest to pin in JonesH/infra
        run: |
          {
            echo "### Image digest"
            echo
            echo '```'
            echo "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
